[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macrium-analyzer"
version = "0.1.0"
description = "Macrium Analyzer CLI"
requires-python = ">=3.10"
dependencies = ["zstandard>=0.23"]

[project.scripts]
macrium-analyzer = "macrium_analyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
